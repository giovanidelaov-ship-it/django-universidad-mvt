
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Detalle del Profesor</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="container mt-4">

    <h1>Detalle del Profesor</h1>

    <div class="card p-4">

        <h3>{{ profesor.nombre }}</h3>

        <hr>

        <h4>Cursos que imparte:</h4>

        {% for curso in cursos %}

            <p>{{ curso.nombre }} - {{ curso.codigo }}</p>

        {% empty %}

            <p>Este profesor todavía no tiene cursos asignados.</p>

        {% endfor %}

    </div>

    <a href="{% url 'web_lista_cursos' %}" class="btn btn-primary mt-3">
        Volver al catálogo
    </a>

</body>
</html>
